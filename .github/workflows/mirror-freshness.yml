name: mirror freshness

# audits/DEPLOYED_VS_SOURCE.md promises that this mirror and the canonical web
# version at kerne.fi/security/deployed-vs-source change in the same commit. On
# 2026-07-28 that promise was found broken inside the file that makes it: the
# mirror was five days stale and listed one fewer standing divergence than the
# live site, on the most sensitive open finding the protocol has. This workflow
# makes the promise enforceable instead of aspirational.
#
# The check compares parsed dates, never strings, because the two surfaces use
# different date formats on purpose. If kerne.fi is unreachable the job passes
# with a loud warning rather than painting a public repo red over someone else's
# outage; drift is the only thing that fails it.
#
# 2026-08-06: that was not enough, and the gap was found the expensive way. This
# job made ZERO on-chain calls. It compared a date and a count in one markdown
# file, and stayed green for nine days while deployments/8453.json asserted that
# public vault deposits were OPEN and that maxDeposit returned 2^256-1, when a
# Safe transaction had shut the door on 2026-07-30 and maxDeposit returned 0.
# Anyone following this repository's own verification instructions would have
# caught it in a single RPC call.
#
# So the second step below actually asserts chain state. It is what turns this
# badge from a claim about two dates into a claim about Base.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 07:15 UTC daily. Catches drift introduced by a website deploy, which does
    # not touch this repository and so triggers none of the events above.
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the mirror against the canonical web version
        run: bash scripts/check_mirror_freshness.sh

      - name: Assert the published vault deposit state against live Base
        # Four eth_calls across four public endpoints, no key and no toolchain.
        # A network problem exits 0 with a warning; only the registry and the
        # chain genuinely disagreeing fails the build. Both directions fail:
        # reopening deposits and forgetting this file is caught too.
        run: python3 scripts/check_registry_vs_chain.py
