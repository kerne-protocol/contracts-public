[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
# forge-std comes from this repository's root submodule (../../lib/forge-std).
# OpenZeppelin is vendored in ./lib at v5.5.0, the revision the deployed vault was
# compiled against, so this folder rebuilds the deployed bytecode.
libs = ["lib", "../../lib"]
allow_paths = ["../../lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=../../lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
base = "https://mainnet.base.org"
